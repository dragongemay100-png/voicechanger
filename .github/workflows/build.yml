name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: unzip -q voicechanger-fabric-mod.zip
      - run: gradle build --no-daemon
        working-directory: voicechanger
      - uses: actions/upload-artifact@v4
        with:
          name: voicechanger-jar
          path: voicechanger/build/libs/voicechanger-1.0.0.jar
